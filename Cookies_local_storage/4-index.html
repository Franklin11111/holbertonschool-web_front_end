<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script defer>
      function showForm() {
        const form = document.querySelector(".form");
        form.style.display = "block";
      }

      function hideForm() {
        const form = document.querySelector(".form");
        form.style.display = "none";
      }

      function deleteCookiesAndShowForm() {
        const now = new Date();
        now.setTime(now.getTime() - 10 * 24 * 60 * 60 * 1000);
        const dayBefore = now.toUTCString();
        Cookies.remove("firstname");
        Cookies.remove("email");

        const welMessage = document.querySelector(".welcomeMessage");
        welMessage.remove();
        showForm();
      }

      function showWelcomeMessageOrForm() {
        if (Cookies.get("firstname")) {
          hideForm();
          const welcomeMessage = document.createElement("h1");
          welcomeMessage.classList.add("welcomeMessage");
          welcomeMessage.innerHTML = `Welcome ${Cookies.get(
            "firstname"
          )} <a style="font-weight: normal; font-size: 30px; font-style: italic;" href="#" onclick="deleteCookiesAndShowForm()">(logout)</a>`;
          document.body.appendChild(welcomeMessage);
        } else {
          showForm();
        }
      }

      function showCookies() {
        const pEl = document.createElement("p");
        pEl.innerHTML = `Email: ${Cookies.get(
          "email"
        )} - Firstname: ${Cookies.get("firstname")}`;
        document.body.appendChild(pEl);
      }

      function setCookiesAndShowWelcomeMessage() {
        const fname = document.getElementById("firstname").value;
        const email = document.querySelector("#email").value;
        Cookies.set("firstname", fname, { expires: 10, path: "" });
        Cookies.set("email", email, { expires: 10, path: "" });
        showWelcomeMessageOrForm();
      }

      document.addEventListener("DOMContentLoaded", () => {
        showWelcomeMessageOrForm();
      });
    </script>
    <title>Document</title>
  </head>
  <body>
    <div class="form">
      <h2>Login to the website</h2>
      <input type="text" id="firstname" />
      <input type="text" id="email" />
      <button onclick="setCookiesAndShowWelcomeMessage()">Log me in</button>
    </div>

    <h2>Cookies</h2>
    <button onclick="showCookies()">Show the cookies</button>
  </body>
</html>
