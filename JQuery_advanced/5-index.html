<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />

    <title>Task 0</title>
  </head>
  <body>
    <script
      src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
      integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8="
      crossorigin="anonymous"
    ></script>
    <script type="application/javascript">
      function createFamilyTree() {
        const tableEl =
          "<table><thead><tr><th>Firstname</th><th>Lastname</th></tr></thead><tbody></tbody></table>";
        $("body").append(tableEl);
      }
      function addNewMember(firstName, lastName) {
        $("tbody").append(
          `<tr><td>${firstName}</td><td>${lastName}</td><td>(x)</td></tr>`
        );
        $("tr td:last").css("backgroundColor", "orange");
        $("tr td:last").click(function () {
          const elem = $(this);
          elem.parent().remove();
        });
      }
      createFamilyTree();
      addNewMember("Guillaume", "Salva");
      addNewMember("Arielle", "Snizt");
      addNewMember("Fanette", "Snizt");
      addNewMember("Gerard", "Snizt");
      addNewMember("Victor", "Salva");
    </script>
  </body>
</html>
