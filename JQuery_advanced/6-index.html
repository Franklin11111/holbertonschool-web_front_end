<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />

    <title>Task 0</title>
  </head>
  <body>
    <script
      src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
      integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8="
      crossorigin="anonymous"
    ></script>
    <script type="application/javascript">
      function createFamilyTree() {
        const tableEl =
          "<table><thead><tr><th>Firstname</th><th>Lastname</th></tr></thead><tbody></tbody></table>";
        $("body").append(tableEl);
      }
      function addNewMember(firstName, lastName, position = "after") {
        if (position === "before") {
          $("tbody").prepend(
            `<tr><td>${firstName}</td><td>${lastName}</td><td>(x)</td></tr>`
          );
        } else if (position === "after") {
          $("tbody").append(
            `<tr><td>${firstName}</td><td>${lastName}</td><td>(x)</td></tr>`
          );
        }

        $("tr td:last").css("backgroundColor", "orange");
        $("tr td:last").click(function () {
          const elem = $(this);
          elem.parent().remove();
        });
      }

      function createForm() {
        const form = $(`
            <input type="text" name="firstname" placeholder="firstname" />
            <input type="text" name="lastname" placeholder="lastname" />
            <select name="position" id="position">
                <option value="before">Before</option>
                <option value="after">After</option>
            </select>
            <input type="submit" />
        `);
        $("table").before(form);
        $("input[type='submit']").click((e) => {
          e.preventDefault();
          const fname = $("input[name='firstname']").val();
          const lname = $("input[name='lastname']").val();
          const pos = $("select").val();
          if (pos === "before") {
            addNewMember(fname, lname, pos);
          } else {
            addNewMember(fname, lname, pos);
          }
        });
      }

      createFamilyTree();
      createForm();
    </script>
  </body>
</html>
